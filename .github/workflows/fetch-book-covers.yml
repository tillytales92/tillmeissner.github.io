name: Fetch book covers (one-off)
on:
  push:
    branches: [main]
    paths: [".github/scripts/fetch_book_covers.py", ".github/workflows/fetch-book-covers.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/fetch_book_covers.py | tee covers_report.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _books assets/img/book_covers
          git commit -m "Add downloaded book covers" || echo "nothing to commit"
          git push
